name: World V2 R18-132 isolated server scene drain and bypass proof
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-132-*'
    paths:
      - '.github/workflows/world-v2-r18-132-scene-publisher-drain.yml'
      - 'staging/world-v2-b10-r18-132-scene-publisher-drain/**'
      - 'tests/world-v2-r18-132-**'
      - 'docs/testing/world-v2-r18-132-server-publisher-drain-2026-11-20.md'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-131-*'
    paths:
      - '.github/workflows/world-v2-r18-132-scene-publisher-drain.yml'
      - 'staging/world-v2-b10-r18-132-scene-publisher-drain/**'
      - 'tests/world-v2-r18-132-**'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout pinned R132 source with ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Ensure protected app and versioned migrations remain unchanged
        run: git diff --exit-code 0741b11e59b151321129a7a3e9d33bb541c29db4 HEAD -- src/ supabase/migrations/
      - name: Check seven-sender inventory and isolated scene drain contract
        run: node --test tests/world-v2-r18-132-scene-drain.test.mjs
      - name: Preserve release hold
        run: echo 'R132 NO_GO - no hosted SQL, full server publication cutoff or signed WebSocket revocation proven.'
  synthetic-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r132_disposable_only
          POSTGRES_DB: world_v2_r18_132
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_132"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R132_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: world_v2_r18_132
      PGPASSWORD: r132_disposable_only
    steps:
      - name: Checkout fabricated PostgreSQL fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove transaction-locked guarded sender and unguarded bypass
        shell: bash
        run: bash tests/world-v2-r18-132-postgres/run.sh
