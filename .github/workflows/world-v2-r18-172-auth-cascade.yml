name: World V2 R18-172 synthetic Auth cascade PG17 and NO_GO
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-172-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-171-*'
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Never change active runtime or historical migrations
        run: git diff --exit-code 5126e8ccadac4095e2b08c89b66cb77468ecb6ef HEAD -- src/ supabase/migrations/
      - name: Check original candidate pins and retention NO_GO
        run: node --test tests/world-v2-r18-172-auth-cascade.test.mjs
  disposable-postgres-17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r172_disposable_only
          POSTGRES_DB: world_v2_r18_172
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_172"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R172_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: world_v2_r18_172
      PGPASSWORD: r172_disposable_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run fictional Auth cascade plus existing 4 scratch guards only
        run: bash tests/world-v2-r18-172-postgres/run.sh
      - name: Preserve release gate
        run: echo 'R172 synthetic-only. Auth deletion retention approval and signed QA remain NO_GO.'
