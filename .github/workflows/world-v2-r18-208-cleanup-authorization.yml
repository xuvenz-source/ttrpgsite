name: World V2 R18-208 privileged cleanup and stale-lease authorization NO_GO
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-208-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-207-*'
permissions:
  contents: read
jobs:
  original-privileged-cleanup-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reject application, Supabase active migrations, Edge and Vercel changes
        run: git diff --exit-code 646d46331f72ab4b30c3eb994c0c1c9c47e80769 HEAD -- src/ supabase/migrations/ supabase/functions/ vercel.json
      - name: Reconcile 67 source census and exact 8 current definer ownership/cleanup markers
        run: python3 scripts/release/r208_validate_cleanup_authorization.py
      - name: Reject forged direct identity, ownership/holder/DM flags, source drift or false security GO
        run: python3 tests/world-v2-r18-208-cleanup-auth.test.py
      - name: Compile read-only validator
        run: python3 -m py_compile scripts/release/r208_validate_cleanup_authorization.py

  source-exact-own-stale-sheet-lease-release:
    needs: original-privileged-cleanup-source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r114_disposable_only
          POSTGRES_DB: world_v2_r18_114
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_114"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R114_ISOLATED: 'yes'
      R115_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: world_v2_r18_114
      PGUSER: postgres
      PGPASSWORD: r114_disposable_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Re-run unchanged original-source R115 revoked-owner + own-stale-lease-release regressions
        shell: bash
        run: bash tests/world-v2-r18-115-postgres/run.sh
