name: World V2 R18-133 isolated observer V3 relay and old-topic bypass
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-133-*'
    paths:
      - '.github/workflows/world-v2-r18-133-observer-relay.yml'
      - 'staging/world-v2-b10-r18-133-observer-v3-relay/**'
      - 'tests/world-v2-r18-133-postgres/**'
      - 'tests/world-v2-r18-133-observer-relay.test.mjs'
      - 'docs/testing/world-v2-r18-133-observer-relay-2026-11-20.md'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-132-*'
    paths:
      - '.github/workflows/world-v2-r18-133-observer-relay.yml'
      - 'staging/world-v2-b10-r18-133-observer-v3-relay/**'
      - 'tests/world-v2-r18-133-postgres/**'
      - 'tests/world-v2-r18-133-observer-relay.test.mjs'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout full R133 ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Ensure all protected source/migrations are unchanged
        run: git diff --exit-code 757bf053c4ee758b298ecea0e536ded2656fd5c1 HEAD -- src/ supabase/migrations/
      - name: Verify six original sender hashes and restrictive observer relay
        run: node --test tests/world-v2-r18-133-observer-relay.test.mjs
      - name: Hold production
        run: echo 'R133 NO_GO - the six original observer senders and hosted WebSocket streams are unchanged.'
  synthetic-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r133_disposable_only
          POSTGRES_DB: world_v2_r18_133
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_133"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R133_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: world_v2_r18_133
      PGPASSWORD: r133_disposable_only
    steps:
      - name: Checkout synthetic PostgreSQL fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate private observer fanout, stale-epoch denial and gate lock
        shell: bash
        run: bash tests/world-v2-r18-133-postgres/run.sh
