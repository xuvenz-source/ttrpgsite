name: World V2 R18-231 owner sanitized R230 receipt and NO_GO gate
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-231-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-230-*'
permissions:
  contents: read
jobs:
  source-only-sanitized-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Disallow active SQL, application, Edge, package and Vercel changes
        run: git diff --exit-code 376991a65b70294668707dcea227e453adc41431 HEAD -- src/ supabase/ vercel.json package.json package-lock.json
      - name: Exactly four sanitized-only source artifacts and no uploaded owner report
        run: |
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only',
            '376991a65b70294668707dcea227e453adc41431',
            'HEAD'],text=True).splitlines())
          expected={
            '.github/workflows/world-v2-r18-231-private-do-receipt.yml',
            'docs/testing/world-v2-r18-231-r230-owner-receipt-triage-2026-11-23.md',
            'scripts/release/r231_verify_owner_r230_sanitized.py',
            'tests/world-v2-r18-231-receipt-gate.test.py'
          }
          assert paths==expected, 'R231_UNREVIEWED_SCOPE'
          assert all(not x.endswith('r230-sanitized-report.json') for x in paths)
          checker=open('scripts/release/r231_verify_owner_r230_sanitized.py').read()
          assert 'EXPECTED_SHA256=' in checker
          assert '345f30ee49d853c9fa8ccefa7679e4a5acb04993f73e40451df7b5cdf3079e01' in checker
          assert 'd["decision"]!="NO_GO"' in checker
          for forbidden in (
             'psycopg','supabase.create_client','subprocess.run','requests.',
             'urllib.request','apply_migration','write_text(','write_bytes('
          ):
            assert forbidden not in checker,'R231_FILE_OR_NETWORK_WRITE_RISK'
          PY
      - name: Run fictional-only adversarial receipt validation
        run: python3 tests/world-v2-r18-231-receipt-gate.test.py
      - name: Syntax-check read-only JSON receipt checker and tests
        run: |
          python3 -m py_compile scripts/release/r231_verify_owner_r230_sanitized.py
          python3 -m py_compile tests/world-v2-r18-231-receipt-gate.test.py
