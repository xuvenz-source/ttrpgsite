name: World V2 R18-158 Storage write boundaries and UPDATE denial
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-158-*'
    paths:
      - '.github/workflows/world-v2-r18-158-storage-writes.yml'
      - 'staging/world-v2-b10-r18-158-storage-write-boundaries/**'
      - 'tests/world-v2-r18-158-*'
      - 'docs/testing/world-v2-r18-158-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-157-*'
permissions:
  contents: read
jobs:
  source-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Keep runtime and versioned migrations unchanged
        run: git diff --exit-code 67c5b62597fa5f1a0786565c21ce12993da184f6 HEAD -- src/ supabase/migrations/
      - name: Verify security and release gates remain NO_GO
        run: node --test tests/world-v2-r18-158-source.test.mjs
  pg17-storage-write-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r158_disposable_only
          POSTGRES_DB: world_v2_r18_158
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_158"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R158_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: world_v2_r18_158
      PGPASSWORD: r158_disposable_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run fictional write ACL and missing UPDATE policy tests
        run: bash tests/world-v2-r18-158-postgres/run.sh
      - name: Preserve hosted SQL and signed multi-account QA hold
        run: echo 'R158 synthetic-only; original Storage UPDATE, live privileges and signed URLs unchanged. NO_GO.'
