name: World V2 R18-126 isolated recipient-scene cutover
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-126-*'
    paths:
      - '.github/workflows/world-v2-r18-126-scene-cutover.yml'
      - 'tests/world-v2-r18-126-postgres/**'
      - 'tests/world-v2-r18-126-scene-cutover.test.mjs'
      - 'staging/world-v2-b10-r18-126-scene-v3-cutover-contract/**'
      - 'docs/testing/world-v2-r18-126-coordinated-scene-v3-cutover-2026-11-19.md'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-125-*'
    paths:
      - '.github/workflows/world-v2-r18-126-scene-cutover.yml'
      - 'tests/world-v2-r18-126-postgres/**'
      - 'tests/world-v2-r18-126-scene-cutover.test.mjs'
      - 'staging/world-v2-b10-r18-126-scene-v3-cutover-contract/**'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source-only tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify protected frontend and versioned migration paths are unchanged
        run: git diff --exit-code bce0495099b07a9d093c14f7695befa99839ef49 HEAD -- src/ supabase/migrations/
      - name: Run dormant client, privacy and SQL contract tests
        run: node --test tests/world-v2-r18-126-scene-cutover.test.mjs
      - name: Hold production and hosted QA
        run: echo "R18-126 NO_GO - no hosted SQL, bundled client, stream verification, signed users, merge or deployment."
  synthetic-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r126_disposable_only
          POSTGRES_DB: world_v2_r18_126
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_126"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R126_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: world_v2_r18_126
      PGPASSWORD: r126_disposable_only
    steps:
      - name: Checkout synthetic-only fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove no shared old publisher and preserve authorized fanout
        shell: bash
        run: bash tests/world-v2-r18-126-postgres/run.sh
