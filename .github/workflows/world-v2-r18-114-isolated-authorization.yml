name: World V2 R18-114 isolated sheet and movement PostgreSQL 17

on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-114-*'
    paths:
      - 'tests/world-v2-r18-114-postgres/**'
      - 'staging/world-v2-b10-r18-114-inventory-uuid-guard/**'
      - 'tests/world-v2-r18-114-inventory-uuid-guard.test.mjs'
      - '.github/workflows/world-v2-r18-114-isolated-authorization.yml'
      - 'supabase/migrations/20261107095350_campaign_sheet_inventory_collaboration.sql'
      - 'supabase/migrations/20261106180100_private_player_maps.sql'
      - 'supabase/migrations/20261108091818_observer_and_per_viewer_visibility_release_20261108.sql'
      - 'staging/world-v2-b10-r18-103-live-source-parity/metadata-index.json'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-113-*'
    paths:
      - 'tests/world-v2-r18-114-postgres/**'
      - 'staging/world-v2-b10-r18-114-inventory-uuid-guard/**'
      - 'tests/world-v2-r18-114-inventory-uuid-guard.test.mjs'
      - '.github/workflows/world-v2-r18-114-isolated-authorization.yml'

permissions:
  contents: read

jobs:
  disposable-postgresql17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r114_disposable_only
          POSTGRES_DB: world_v2_r18_114
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_114"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R114_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: world_v2_r18_114
      PGUSER: postgres
      PGPASSWORD: r114_disposable_only
    steps:
      - name: Checkout source with no hosted Supabase credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test six source-hash-bound functions with synthetic role and identity fixtures
        shell: bash
        run: bash tests/world-v2-r18-114-postgres/run.sh
