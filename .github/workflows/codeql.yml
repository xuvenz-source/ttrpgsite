name: CodeQL security scan

on:
  push:
    branches:
      - main
      - stage/complete-predictive-navigation-and-fog-2026-11-09
      - stage/unified-realtime-movement-2026-11-09
      - 'stage/world-v2-b10-*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      statuses: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze application
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

      - name: Publish staging CodeQL result
        if: always() && (github.ref == 'refs/heads/stage/complete-predictive-navigation-and-fog-2026-11-09' || github.ref == 'refs/heads/stage/unified-realtime-movement-2026-11-09')
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_RESULT: ${{ job.status }}
        run: |
          if [ "$CODEQL_RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f "state=$state" \
            -f "context=ttrpg/staging-codeql" \
            -f "description=CodeQL security-extended JavaScript and TypeScript analysis" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
