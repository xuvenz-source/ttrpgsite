# R266-GH: execute only fictional SQL on an isolated, disposable GitHub runner.
# NEVER check out project sources or load original historical migration data.
name: R266-GH fictional removed-member invite revocation and rejoin test

on:
  push:
    branches:
      - stage/r266-fictional-invite-revocation-removed-member-2026-11-23
    paths:
      - .github/workflows/r266-gh-fictional-invite-revocation.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: r266-gh-fictional-db
  cancel-in-progress: false

jobs:
  fictional-rls-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Verify no repository checkout, credentials or existing containers
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] || [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Cloud credentials must be absent"
            exit 1
          fi
          if [ -e "$HOME/.supabase/access-token" ] || [ -e "$GITHUB_WORKSPACE/supabase/config.toml" ]; then
            echo "::error::Unexpected checkout or cloud link"
            exit 1
          fi
          docker info >/dev/null
          if [ -n "$(docker ps -aq)" ]; then
            echo "::error::Expected a fresh runner without containers"
            exit 1
          fi
          memory_kib="$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          disk_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          if [ "$memory_kib" -lt 7340032 ] || [ "$disk_kib" -lt 9437184 ]; then
            echo "::error::Insufficient resources for isolated full stack"
            exit 1
          fi
          echo "R266-GH isolated runner preflight PASS"

      - name: Install exact validated Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: '3.2.0'

      - name: Launch cloud-unlinked scratch stack and test fictional RLS
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          scratch="$RUNNER_TEMP/r266-gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          network="r266-gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$scratch"
          cleanup() {
            original_rc=$?
            trap - EXIT
            cleanup_rc=0
            if [ -f "$scratch/supabase/config.toml" ]; then
              (cd "$scratch" && supabase --network-id "$network" stop --no-backup >/dev/null 2>&1) || cleanup_rc=1
            fi
            leftovers="$(docker ps -aq --filter "network=$network" 2>/dev/null)" || cleanup_rc=1
            if [ -n "$leftovers" ]; then
              printf '%s\n' "$leftovers" | xargs -r docker rm -f >/dev/null 2>&1 || cleanup_rc=1
            fi
            if docker network inspect "$network" >/dev/null 2>&1; then
              docker network rm "$network" >/dev/null 2>&1 || cleanup_rc=1
            fi
            rm -rf -- "$scratch" || cleanup_rc=1
            if [ "$cleanup_rc" -ne 0 ]; then
              echo "::error::Scratch cleanup incomplete"
              exit 1
            fi
            if [ "$original_rc" -eq 0 ]; then
              echo "R266-GH cleanup PASS"
            fi
            exit "$original_rc"
          }
          trap cleanup EXIT

          supabase --version
          supabase --help | grep -q -- '--network-id'
          supabase start --help | grep -q -- '--exclude'

          docker network create --driver bridge \
            --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
            "$network" >/dev/null
          binding="$(docker network inspect -f '{{index .Options "com.docker.network.bridge.host_binding_ipv4"}}' "$network")"
          test "$binding" = "127.0.0.1"

          cd "$scratch"
          supabase init >/dev/null 2>&1
          test -f supabase/config.toml
          if [ -e supabase/.temp/project-ref ] || [ -e supabase/seed.sql ]; then
            echo "::error::Unexpected linked project or seed file"
            exit 1
          fi
          if [ -d supabase/migrations ] && [ -n "$(find supabase/migrations -type f -print -quit)" ]; then
            echo "::error::Unexpected historical migrations"
            exit 1
          fi
          if ! supabase --network-id "$network" start \
            --exclude studio,imgproxy,logflare,vector,supavisor >/dev/null 2>&1; then
            echo "::error::Scratch startup failed"
            exit 1
          fi
          supabase --network-id "$network" status >/dev/null 2>&1

          # All running containers must belong to our network; all exposed ports
          # must be bound to loopback; locate the ONE local PostgreSQL container.
          db_id="$(python3 - "$network" <<'PY'
          import json
          import subprocess
          import sys

          network = sys.argv[1]
          ids = subprocess.check_output(
              ["docker", "ps", "-q"], text=True
          ).split()
          if not ids:
              raise SystemExit("No isolated containers")
          containers = json.loads(subprocess.check_output(
              ["docker", "inspect", *ids], text=True
          ))
          databases = []
          mapped = 0
          for container in containers:
              networks = container.get("NetworkSettings", {}).get("Networks") or {}
              if network not in networks:
                  raise SystemExit("Container escaped isolated network")
              for bindings in (container.get("NetworkSettings", {}).get("Ports") or {}).values():
                  for item in bindings or []:
                      if item.get("HostIp") not in ("127.0.0.1", "::1"):
                          raise SystemExit("Non-loopback port binding")
                      mapped += 1
              image = container.get("Config", {}).get("Image") or ""
              if "supabase/postgres:" in image:
                  databases.append(container.get("Id", ""))
          if len(containers) < 3 or mapped < 2 or len(databases) != 1:
              raise SystemExit("Incomplete local stack or ambiguous database")
          print(databases[0])
          PY
          )"
          if [ -z "$db_id" ]; then
            echo "::error::Isolated scratch database could not be selected"
            exit 1
          fi

          # Generated fictional-only SQL: no Git checkout, no real migration,
          # no project identifiers, no user data and no hosted SQL operation.
          cat > "$scratch/fictional.sql" <<'SQL'
          BEGIN;
          -- Entirely invented IDs, objects and tenants; NOT owner history.
          CREATE TABLE public.r257_fictional_characters(
            id uuid PRIMARY KEY,
            tenant_id uuid NOT NULL,
            owner_id uuid NOT NULL
          );
          CREATE TABLE public.r257_fictional_tokens(
            id uuid PRIMARY KEY,
            tenant_id uuid NOT NULL,
            owner_id uuid NOT NULL,
            character_id uuid NOT NULL
          );
          CREATE TABLE public.r257_fictional_map_flags(
            id uuid PRIMARY KEY,
            fog_active boolean NOT NULL
          );
          CREATE TABLE public.r257_fictional_map_members(
            map_id uuid NOT NULL,
            actor_id uuid NOT NULL,
            PRIMARY KEY(map_id,actor_id)
          );
          ALTER TABLE public.r257_fictional_tokens ENABLE ROW LEVEL SECURITY;
          GRANT USAGE ON SCHEMA public TO authenticated,anon;
          GRANT SELECT ON public.r257_fictional_characters TO authenticated;
          GRANT SELECT,INSERT ON public.r257_fictional_tokens TO authenticated;
          GRANT SELECT ON public.r257_fictional_tokens TO anon;
          CREATE POLICY r257_view_own_fake_tokens ON public.r257_fictional_tokens
            FOR SELECT TO authenticated
            USING (owner_id=(SELECT auth.uid()));
          CREATE POLICY r257_insert_fake_token_with_tenant_join
            ON public.r257_fictional_tokens
            FOR INSERT TO authenticated
            WITH CHECK (
              owner_id=(SELECT auth.uid())
              AND EXISTS(
                SELECT 1 FROM public.r257_fictional_characters AS ch
                WHERE ch.id=r257_fictional_tokens.character_id
                  AND ch.tenant_id=r257_fictional_tokens.tenant_id
                  AND ch.owner_id=(SELECT auth.uid())
              )
            );

          INSERT INTO public.r257_fictional_characters VALUES
            ('aaaaaaaa-1111-4111-8111-111111111111',
             '11111111-1111-4111-8111-111111111111',
             'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),
            ('aaaaaaaa-2222-4222-8222-222222222222',
             '22222222-2222-4222-8222-222222222222',
             'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),
            ('bbbbbbbb-2222-4222-8222-222222222222',
             '22222222-2222-4222-8222-222222222222',
             'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          INSERT INTO public.r257_fictional_map_flags VALUES
            ('11111111-1111-4111-8111-111111111111',true),
            ('22222222-2222-4222-8222-222222222222',true);
          INSERT INTO public.r257_fictional_map_members VALUES
            ('11111111-1111-4111-8111-111111111111',
             'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),
            ('22222222-2222-4222-8222-222222222222',
             'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');

          CREATE FUNCTION public.r257_fictional_authorized_flag(p_map uuid)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER
          SET search_path='' AS $fictional$
            SELECT (SELECT auth.uid()) IS NOT NULL AND EXISTS(
              SELECT 1
              FROM public.r257_fictional_map_flags AS f
              JOIN public.r257_fictional_map_members AS m
                ON m.map_id=f.id
              WHERE f.id=p_map AND m.actor_id=(SELECT auth.uid())
                AND f.fog_active
            );
          $fictional$;
          REVOKE ALL ON FUNCTION public.r257_fictional_authorized_flag(uuid)
            FROM PUBLIC,anon;
          GRANT EXECUTE ON FUNCTION public.r257_fictional_authorized_flag(uuid)
            TO authenticated;

          -- Fictional retained resource and membership are deliberately
          -- independent: removing membership must revoke ALL resource access.
          CREATE TABLE public.r262_fictional_memberships(
            tenant_id uuid NOT NULL,
            actor_id uuid NOT NULL,
            PRIMARY KEY(tenant_id,actor_id)
          );
          INSERT INTO public.r262_fictional_memberships VALUES
            ('11111111-1111-4111-8111-111111111111',
             'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),
            ('22222222-2222-4222-8222-222222222222',
             'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');

          CREATE FUNCTION public.r262_fictional_can_edit_resource(
            p_tenant uuid,p_resource uuid)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER
          SET search_path='' AS $fictional_member$
            SELECT (SELECT auth.uid()) IS NOT NULL
              AND EXISTS(
                SELECT 1 FROM public.r262_fictional_memberships AS mem
                WHERE mem.tenant_id=p_tenant
                  AND mem.actor_id=(SELECT auth.uid())
              )
              AND EXISTS(
                SELECT 1 FROM public.r257_fictional_characters AS resource
                WHERE resource.id=p_resource
                  AND resource.tenant_id=p_tenant
                  AND resource.owner_id=(SELECT auth.uid())
              );
          $fictional_member$;
          REVOKE ALL ON FUNCTION
            public.r262_fictional_can_edit_resource(uuid,uuid)
            FROM PUBLIC,anon;
          GRANT EXECUTE ON FUNCTION
            public.r262_fictional_can_edit_resource(uuid,uuid)
            TO authenticated;

          SELECT set_config('request.jwt.claim.sub',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',true);
          SET LOCAL ROLE authenticated;
          DO $check$
          DECLARE n integer; visible_flag boolean;
          BEGIN
            INSERT INTO public.r257_fictional_tokens VALUES
              ('11111111-aaaa-4aaa-8aaa-111111111111',
               '11111111-1111-4111-8111-111111111111',
               'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
               'aaaaaaaa-1111-4111-8111-111111111111');
            SELECT count(*) INTO n FROM public.r257_fictional_tokens;
            IF n<>1 THEN RAISE EXCEPTION 'R257 fictional same-tenant insert missing'; END IF;

            -- A also owns an unrelated fictional character in tenant B.
            -- Cross-tenant placement MUST fail even with matching owner.
            BEGIN
              INSERT INTO public.r257_fictional_tokens VALUES
                ('22222222-aaaa-4aaa-8aaa-222222222222',
                 '22222222-2222-4222-8222-222222222222',
                 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                 'aaaaaaaa-1111-4111-8111-111111111111');
              RAISE EXCEPTION 'R257 cross-tenant owned character permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;

            SELECT public.r257_fictional_authorized_flag(
              '11111111-1111-4111-8111-111111111111') INTO visible_flag;
            IF visible_flag IS NOT TRUE THEN
              RAISE EXCEPTION 'R257 authorized fictional flag denied';
            END IF;
            SELECT public.r257_fictional_authorized_flag(
              '22222222-2222-4222-8222-222222222222') INTO visible_flag;
            IF visible_flag IS NOT FALSE THEN
              RAISE EXCEPTION 'R257 other-tenant fictional metadata leaked';
            END IF;
            SELECT public.r257_fictional_authorized_flag(NULL) INTO visible_flag;
            IF visible_flag IS NOT FALSE THEN
              RAISE EXCEPTION 'R257 null fictional map accepted';
            END IF;
          END $check$;
          RESET ROLE;

          SELECT set_config('request.jwt.claim.sub',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',true);
          SET LOCAL ROLE authenticated;
          DO $check$
          DECLARE n integer; visible_flag boolean;
          BEGIN
            SELECT count(*) INTO n FROM public.r257_fictional_tokens;
            IF n<>0 THEN
              RAISE EXCEPTION 'R257 actor B read actor A fictional token';
            END IF;
            BEGIN
              INSERT INTO public.r257_fictional_tokens VALUES
                ('bbbbbbbb-aaaa-4aaa-8aaa-bbbbbbbbbbbb',
                 '11111111-1111-4111-8111-111111111111',
                 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
                 'aaaaaaaa-1111-4111-8111-111111111111');
              RAISE EXCEPTION 'R257 other owner character accepted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
            SELECT public.r257_fictional_authorized_flag(
              '11111111-1111-4111-8111-111111111111') INTO visible_flag;
            IF visible_flag IS NOT FALSE THEN
              RAISE EXCEPTION 'R257 B received A private map flag';
            END IF;
          END $check$;
          RESET ROLE;

          SELECT set_config('request.jwt.claim.sub','',true);
          SET LOCAL ROLE anon;
          DO $check$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM public.r257_fictional_tokens;
            IF n<>0 THEN RAISE EXCEPTION 'R257 anon token read'; END IF;
            BEGIN
              PERFORM public.r257_fictional_authorized_flag(
                '11111111-1111-4111-8111-111111111111');
              RAISE EXCEPTION 'R257 anon map function callable';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $check$;
          RESET ROLE;
          -- Entirely fictional owner A retains a resource after removal.
          -- Active membership permits, removal denies, rejoin restores.
          SELECT set_config('request.jwt.claim.sub',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',true);
          SET LOCAL ROLE authenticated;
          DO $check$
          DECLARE allowed boolean;
          BEGIN
            SELECT public.r262_fictional_can_edit_resource(
              '11111111-1111-4111-8111-111111111111',
              'aaaaaaaa-1111-4111-8111-111111111111')
            INTO allowed;
            IF allowed IS NOT TRUE THEN
              RAISE EXCEPTION 'R262 active owner denied retained resource';
            END IF;
          END $check$;
          RESET ROLE;

          DELETE FROM public.r262_fictional_memberships
           WHERE tenant_id='11111111-1111-4111-8111-111111111111'
             AND actor_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
          DO $check$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM public.r257_fictional_characters
             WHERE id='aaaaaaaa-1111-4111-8111-111111111111';
            IF n<>1 THEN RAISE EXCEPTION 'R262 resource unexpectedly deleted'; END IF;
          END $check$;
          SELECT set_config('request.jwt.claim.sub',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',true);
          SET LOCAL ROLE authenticated;
          DO $check$
          DECLARE allowed boolean;
          BEGIN
            SELECT public.r262_fictional_can_edit_resource(
              '11111111-1111-4111-8111-111111111111',
              'aaaaaaaa-1111-4111-8111-111111111111')
            INTO allowed;
            IF allowed IS NOT FALSE THEN
              RAISE EXCEPTION 'R262 removed owner retained fictional access';
            END IF;
          END $check$;
          RESET ROLE;

          INSERT INTO public.r262_fictional_memberships VALUES
            ('11111111-1111-4111-8111-111111111111',
             'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
          SELECT set_config('request.jwt.claim.sub',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',true);
          SET LOCAL ROLE authenticated;
          DO $check$
          DECLARE allowed boolean;
          BEGIN
            SELECT public.r262_fictional_can_edit_resource(
              '11111111-1111-4111-8111-111111111111',
              'aaaaaaaa-1111-4111-8111-111111111111')
            INTO allowed;
            IF allowed IS NOT TRUE THEN
              RAISE EXCEPTION 'R262 active owner rejoin not restored';
            END IF;
          END $check$;
          RESET ROLE;

          -- R266: fictional invitation with persistent removed-user revocation.
          CREATE TABLE public.r266_fake_invites(
            code text PRIMARY KEY,
            tenant_id uuid NOT NULL,
            active boolean NOT NULL
          );
          CREATE TABLE public.r266_fake_revocations(
            tenant_id uuid NOT NULL,
            actor_id uuid NOT NULL,
            PRIMARY KEY(tenant_id,actor_id)
          );
          INSERT INTO public.r266_fake_invites VALUES
            ('fictional-old-invite-1111',
             '11111111-1111-4111-8111-111111111111',true),
            ('fictional-new-invite-1111',
             '11111111-1111-4111-8111-111111111111',true);

          CREATE FUNCTION public.r266_fictional_join_with_invite(p_code text)
          RETURNS boolean LANGUAGE plpgsql VOLATILE SECURITY DEFINER
          SET search_path='' AS $fake_join$
          DECLARE actor uuid:=(SELECT auth.uid());target uuid;
          BEGIN
            IF actor IS NULL THEN RETURN false; END IF;
            SELECT i.tenant_id INTO target
            FROM public.r266_fake_invites AS i
            WHERE i.code=p_code AND i.active FOR SHARE;
            IF target IS NULL THEN RETURN false; END IF;
            IF EXISTS(
              SELECT 1 FROM public.r266_fake_revocations AS revoked
              WHERE revoked.tenant_id=target AND revoked.actor_id=actor
            ) THEN RETURN false; END IF;
            INSERT INTO public.r262_fictional_memberships(tenant_id,actor_id)
            VALUES(target,actor) ON CONFLICT DO NOTHING;
            RETURN true;
          END $fake_join$;
          REVOKE ALL ON FUNCTION public.r266_fictional_join_with_invite(text)
            FROM PUBLIC,anon;
          GRANT EXECUTE ON FUNCTION public.r266_fictional_join_with_invite(text)
            TO authenticated;

          -- B had access to campaign A, was removed, but remembers old code.
          INSERT INTO public.r262_fictional_memberships VALUES
            ('11111111-1111-4111-8111-111111111111',
             'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          DELETE FROM public.r262_fictional_memberships
            WHERE tenant_id='11111111-1111-4111-8111-111111111111'
            AND actor_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
          INSERT INTO public.r266_fake_revocations VALUES
            ('11111111-1111-4111-8111-111111111111',
             'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');

          SELECT set_config('request.jwt.claim.sub',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',true);
          SET LOCAL ROLE authenticated;
          DO $fake_assert$
          DECLARE allowed boolean;
          BEGIN
            SELECT public.r266_fictional_join_with_invite(
              'fictional-old-invite-1111') INTO allowed;
            IF allowed IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'R266 removed member rejoined through stale code';
            END IF;
            SELECT public.r266_fictional_join_with_invite(
              'fictional-new-invite-1111') INTO allowed;
            IF allowed IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'R266 removed actor bypassed revocation with new code';
            END IF;
          END $fake_assert$;
          RESET ROLE;

          -- DM explicitly reinstates B and revokes the old code.
          DELETE FROM public.r266_fake_revocations
            WHERE tenant_id='11111111-1111-4111-8111-111111111111'
            AND actor_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
          UPDATE public.r266_fake_invites SET active=false
            WHERE code='fictional-old-invite-1111';
          SELECT set_config('request.jwt.claim.sub',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',true);
          SET LOCAL ROLE authenticated;
          DO $fake_assert$
          DECLARE allowed boolean;
          BEGIN
            SELECT public.r266_fictional_join_with_invite(
              'fictional-old-invite-1111') INTO allowed;
            IF allowed IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'R266 revoked invitation was accepted';
            END IF;
            SELECT public.r266_fictional_join_with_invite(
              'fictional-new-invite-1111') INTO allowed;
            IF allowed IS DISTINCT FROM true THEN
              RAISE EXCEPTION 'R266 DM-reinstated invitee unable to join';
            END IF;
          END $fake_assert$;
          RESET ROLE;
          DO $fake_assert$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM public.r262_fictional_memberships
            WHERE tenant_id='11111111-1111-4111-8111-111111111111'
              AND actor_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';
            IF n<>1 THEN
              RAISE EXCEPTION 'R266 fictional membership not restored';
            END IF;
          END $fake_assert$;

          -- Anonymous cannot call the join RPC.
          SELECT set_config('request.jwt.claim.sub','',true);
          SET LOCAL ROLE anon;
          DO $fake_assert$
          BEGIN
            BEGIN
              PERFORM public.r266_fictional_join_with_invite(
                'fictional-new-invite-1111');
              RAISE EXCEPTION 'R266 anonymous fictional join permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
          END $fake_assert$;
          RESET ROLE;
          ROLLBACK;
          DO $check$
          BEGIN
            IF to_regclass('public.r266_fake_invites') IS NOT NULL
              OR to_regclass('public.r266_fake_revocations') IS NOT NULL
              OR to_regprocedure('public.r266_fictional_join_with_invite(text)') IS NOT NULL
              OR to_regclass('public.r262_fictional_memberships') IS NOT NULL
              OR to_regprocedure('public.r262_fictional_can_edit_resource(uuid,uuid)') IS NOT NULL
              OR to_regclass('public.r257_fictional_tokens') IS NOT NULL
              OR to_regclass('public.r257_fictional_characters') IS NOT NULL
              OR to_regclass('public.r257_fictional_map_flags') IS NOT NULL
              OR to_regclass('public.r257_fictional_map_members') IS NOT NULL
              OR to_regprocedure('public.r257_fictional_authorized_flag(uuid)') IS NOT NULL
            THEN RAISE EXCEPTION 'R257 fake fixtures survived rollback'; END IF;
          END $check$;
          SQL
          # Execute inside the uniquely identified local database container:
          # no host SQL URL, connection string, database password or remote flags.
          if ! docker exec --user postgres -i "$db_id" \
            psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < "$scratch/fictional.sql" >/dev/null; then
            echo "::error::Fictional-only SQL / RLS isolation probe failed"
            exit 1
          fi
          echo "R266-GH PASS: fictional tenant and resource denial, stale invite revoked, re-admission explicit, anonymous denial and rollback"
          {
            echo "## R266-GH — fictional cross-tenant RLS and map flag tests"
            echo
            echo "- Fictional SQL executed only inside isolated, cloud-unlinked GitHub runner"
            echo "- Fictional owner A positive and cross-tenant/other-actor/anon negative checks passed"
            echo "- SQL transaction rolled back and synthetic table absence verified"
            echo "- No repository checkout, original SQL, real account, hosted Supabase or Vercel changes"
            echo "- This result does NOT authorize original 83 migrations or any release"
          } >> "$GITHUB_STEP_SUMMARY"
