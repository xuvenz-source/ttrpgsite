name: World V2 R18-202 Storage nested OR AST NO_GO
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-202-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-201-*'
permissions:
  contents: read
jobs:
  original-current-storage-ast-no-go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Refuse changes to live frontend, active migrations, Edge or Vercel
        run: git diff --exit-code 8aa37b14b99734073113137c2336149ef375d530 HEAD -- src/ supabase/migrations/ supabase/functions/ vercel.json
      - name: Validate original anonymized 3-policy AST root AND evidence and exact scratch source
        run: python3 scripts/release/r202_validate_storage_nested_or_ast.py
      - name: Reject nested OR drift, insecure GO and changed evidence
        run: python3 tests/world-v2-r18-202-storage-ast.test.py
      - name: Compile source-only Python
        run: python3 -m py_compile scripts/release/r202_validate_storage_nested_or_ast.py

  synthetic-nested-or-cross-bucket:
    needs: original-current-storage-ast-no-go
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r201_disposable_only
          POSTGRES_DB: world_v2_r18_201
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_201"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R201_ISOLATED: 'yes'
      R202_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: world_v2_r18_201
      PGUSER: postgres
      PGPASSWORD: r201_disposable_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Re-run unchanged R201 fixture and prove nested OR bypass despite root AND then ROLLBACK
        shell: bash
        run: bash tests/world-v2-r18-202-postgres/run.sh
