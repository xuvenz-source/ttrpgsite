name: World V2 R18-204 Storage map-helper membership OR NO_GO
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-204-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-203-*'
permissions:
  contents: read
jobs:
  original-helper-and-operation-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: No live app, active migration, Supabase Edge or deployment changes
        run: git diff --exit-code f70e1528921353dd5c211d23db833d353d652e55 HEAD -- src/ supabase/migrations/ supabase/functions/ vercel.json
      - name: Verify original map helper source/fixed lexical depths and Storage operation markers
        run: python3 scripts/release/r204_validate_helper_membership_branch.py
      - name: Reject authorization OR, signature, SHA, hosted and QA approval drift
        run: python3 tests/world-v2-r18-204-helper-branch.test.py
      - name: Compile source-only validator
        run: python3 -m py_compile scripts/release/r204_validate_helper_membership_branch.py

  synthetic-revoked-stale-assignment-member-guard:
    needs: original-helper-and-operation-source-only
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r201_disposable_only
          POSTGRES_DB: world_v2_r18_201
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_201"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R201_ISOLATED: 'yes'
      R202_ISOLATED: 'yes'
      R203_ISOLATED: 'yes'
      R204_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: world_v2_r18_201
      PGUSER: postgres
      PGPASSWORD: r201_disposable_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Re-run R201/R202/R203 and prove synthetic DM/current P1/removed owner/outsider member-before-OR guard
        shell: bash
        run: bash tests/world-v2-r18-204-postgres/run.sh
