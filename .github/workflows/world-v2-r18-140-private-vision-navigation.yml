name: World V2 R18-140 private vision and navigation facade
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-140-*'
    paths:
      - '.github/workflows/world-v2-r18-140-private-vision-navigation.yml'
      - 'staging/world-v2-b10-r18-140-private-vision-navigation/**'
      - 'tests/world-v2-r18-140-*'
      - 'docs/testing/world-v2-r18-140-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-139-*'
permissions:
  contents: read
jobs:
  exact-source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Assert no browser source or versioned migration change
        run: git diff --exit-code a5de4681558be7aceaec4060915137eb4f814df7 HEAD -- src/ supabase/migrations/
      - name: Verify five closed, original V2-sourced contracts
        run: node --test tests/world-v2-r18-140-private-vision-navigation.test.mjs
      - name: Deny release
        run: echo "R140 NO_GO — no hosted SQL, browser grants, merged PR or deployment."
  isolated-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r138_disposable_only
          POSTGRES_DB: world_v2_r18_138
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_138"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R138_ISOLATED: 'yes'
      R140_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: world_v2_r18_138
      PGPASSWORD: r138_disposable_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile fictional original V2 and five closed V3 facades
        shell: bash
        run: bash tests/world-v2-r18-140-postgres/run.sh
      - name: Deny rollout
        run: echo 'PG17 source-only proof; real signed DM/P1/P2/outsider and free-tier performance still required.'
