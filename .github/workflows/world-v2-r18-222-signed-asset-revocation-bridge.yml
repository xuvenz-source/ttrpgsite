name: World V2 R18-222 staged signed-asset revocation bridge NO_GO
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-222-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-221-*'
permissions:
  contents: read
jobs:
  synthetic-confirmed-revocation-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Enforce no changes to live app, migrations, Edge or deployment
        run: git diff --exit-code 14e7fba803b9ec4ca0eeab92be27d59c2abc6f67 HEAD -- src/ supabase/ vercel.json package.json package-lock.json
      - name: Require exact four R222 staging-only files
        run: |
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output([
            'git','diff','--name-only','14e7fba803b9ec4ca0eeab92be27d59c2abc6f67','HEAD'
          ],text=True).splitlines())
          allowed={
            'staging/world-v2-b10-r18-222-signed-asset-revocation-bridge/SignedAssetRevocationBridge.js',
            'tests/world-v2-r18-222-signed-asset-revocation-bridge.test.mjs',
            'docs/testing/world-v2-r18-222-signed-asset-revocation-bridge-2026-11-22.md',
            '.github/workflows/world-v2-r18-222-signed-asset-revocation-bridge.yml',
          }
          assert changed==allowed, 'R222_UNREVIEWED_SOURCE_SCOPE'
          PY
      - name: Test actual staged sentinel and cache candidate with fictional actor and signer
        run: node --test tests/world-v2-r18-222-signed-asset-revocation-bridge.test.mjs
      - name: Preserve R221 cache locking and R123 revocation teardown contracts
        run: |
          node --test tests/world-v2-r18-221-signed-asset-revocation-lock.test.mjs
          node --test tests/world-v2-r18-123-access-revocation-guard.test.mjs
