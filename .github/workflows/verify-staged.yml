name: Verify staged tabletop changes
on:
  push:
    branches:
      - feature/token-status-markers
      - feature/compact-tabletop-ui
      - feature/weapon-attack-cards
      - stage/attribute-equipment-spell-cards
      - stage/inventory-grid-item-tiles
      - stage/account-settings-map-measurements
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without publishing
        run: npm install --no-audit --no-fund
      - name: Run staged frontend unit tests
        run: node --test tests/*.test.mjs
      - name: Validate Vite production build (no Vercel deployment)
        run: npm run build
      - name: Prepare Deno to type-check the staged account endpoint
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check username-update Supabase Edge Function
        run: deno check supabase/functions/username-update/index.ts
