name: Verify staged tabletop changes
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'stage/**'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A duplicate R14 push job hung in npm test; fail closed rather than
    # consuming shared CI resources indefinitely or treating it as passed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without publishing
        run: npm install --no-audit --no-fund
      - name: Catch undeclared variables in safety-critical interactive components
        run: npm run lint:critical
      - name: Run staged frontend unit tests
        run: npm test
      - name: Audit production dependencies for high-severity issues
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Vite production build (no Vercel deployment)
        run: npm run build
      - name: Prepare pinned Deno from npm for Edge Function type checks
        run: |
          npm install --global --no-audit --no-fund deno@2.9.6
          deno --version
      - name: Type-check signup Turnstile Supabase Edge Function
        run: deno check supabase/functions/username-register/index.ts
      - name: Type-check username-update Supabase Edge Function
        run: deno check supabase/functions/username-update/index.ts
      - name: R18-47 generate official CLI versions offline (scratch directory only)
        if: github.sha == 'db0a1de2689fa5fe4199c696ee780335cc6509d5'
        run: bash scripts/release/generate-world-v2-r18-47-offline-cli-shells.sh
      - name: Archive official empty migration shells and manifest (no credentials)
        if: github.sha == 'db0a1de2689fa5fe4199c696ee780335cc6509d5'
        uses: actions/upload-artifact@v4
        with:
          name: r18-47-pinned-cli-empty-shells
          path: |
            ${{ runner.temp }}/b10-r18-47-offline-cli/manifest.json
            ${{ runner.temp }}/b10-r18-47-offline-cli/supabase/migrations/*.sql
          retention-days: 7
