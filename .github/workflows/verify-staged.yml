name: Verify staged tabletop changes
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'stage/**'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A duplicate R14 push job hung in npm test; fail closed rather than
    # consuming shared CI resources indefinitely or treating it as passed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without publishing
        run: npm install --no-audit --no-fund
      - name: Catch undeclared variables in safety-critical interactive components
        run: npm run lint:critical
      - name: Run staged frontend unit tests
        run: npm test
      - name: Audit production dependencies for high-severity issues
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Vite production build (no Vercel deployment)
        run: npm run build
      - name: Prepare pinned Deno from npm for Edge Function type checks
        run: |
          npm install --global --no-audit --no-fund deno@2.9.6
          deno --version
      - name: Type-check signup Turnstile Supabase Edge Function
        run: deno check supabase/functions/username-register/index.ts
      - name: Type-check username-update Supabase Edge Function
        run: deno check supabase/functions/username-update/index.ts


  # R18-48 temporary credential-free official migration version generation.
  # Remove this job after recording CLI output; never merge or deploy it.
  r48-offline-seal-shell:
    if: github.ref == 'refs/heads/stage/world-v2-b10-r18-48-narrow-atomic-release-2026-11-13'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ""
      SUPABASE_DB_PASSWORD: ""
      DATABASE_URL: ""
      PGHOST: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate narrow seal filename by exact official Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${SUPABASE_ACCESS_TOKEN:-}" && -z "${DATABASE_URL:-}" ]]
          cd "$RUNNER_TEMP"
          mkdir r48-offline-cli
          cd r48-offline-cli
          npx --yes supabase@2.81.3 --version
          npx --yes supabase@2.81.3 migration new --help >/dev/null
          npx --yes supabase@2.81.3 init
          npx --yes supabase@2.81.3 migration new r48_narrow_release_seal
          find supabase/migrations -maxdepth 1 -name '*.sql' -printf 'R48_OFFICIAL_SHELL=%f\n'
