name: World V2 R18-129 isolated catalog and fog metadata authorization audit
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-129-*'
    paths:
      - '.github/workflows/world-v2-r18-129-rpc-stream-fog-audit.yml'
      - 'tests/world-v2-r18-129-postgres/**'
      - 'tests/world-v2-r18-129-catalog-fog.test.mjs'
      - 'staging/world-v2-b10-r18-129-rpc-stream-fog-audit/**'
      - 'docs/testing/world-v2-r18-129-privileged-stream-fog-audit-2026-11-19.md'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-128-*'
    paths:
      - '.github/workflows/world-v2-r18-129-rpc-stream-fog-audit.yml'
      - 'tests/world-v2-r18-129-postgres/**'
      - 'tests/world-v2-r18-129-catalog-fog.test.mjs'
      - 'staging/world-v2-b10-r18-129-rpc-stream-fog-audit/**'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout audited R129 source with complete ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Guard live frontend and versioned migrations
        run: git diff --exit-code ff63103b4767057fe2165503e35d8f75f9a9ed41 HEAD -- src/ supabase/migrations/
      - name: Verify catalog metadata drift, fog authorization and NO_GO
        run: node --test tests/world-v2-r18-129-catalog-fog.test.mjs
      - name: Hold production and hosted databases
        run: echo 'R129 NO_GO - no hosted SQL, live signed users, Realtime stream freeze, merge or deployment.'
  synthetic-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r129_disposable_only
          POSTGRES_DB: world_v2_r18_129
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_129"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R129_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: world_v2_r18_129
      PGPASSWORD: r129_disposable_only
    steps:
      - name: Checkout fictional campaign and fog fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove old fog metadata oracle, strict corrective denial, direct ACLs
        shell: bash
        run: bash tests/world-v2-r18-129-postgres/run.sh
