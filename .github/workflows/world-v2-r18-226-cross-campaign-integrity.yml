name: World V2 R18-226 cross-campaign composite keys PG17 NO_GO
on:
  push:
    branches:
      - 'stage/world-v2-b10-r18-226-*'
  pull_request:
    branches:
      - 'stage/world-v2-b10-r18-225-*'
permissions:
  contents: read
jobs:
  source-only-tenant-relation-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Deny live UI/active Supabase/Edge/Vercel/package changes
        run: git diff --exit-code 7087467faf9105830b4ad3b230bd7476955ac217 HEAD -- src/ supabase/ vercel.json package.json package-lock.json
      - name: Enforce exactly five invented-source-only R226 files
        run: |
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output([
            'git','diff','--name-only','7087467faf9105830b4ad3b230bd7476955ac217','HEAD'
          ],text=True).splitlines())
          expected={
            'staging/world-v2-b10-r18-226-cross-campaign-integrity/unapplied-composite-campaign-keys.sql',
            'tests/world-v2-r18-226-postgres/fictional-tenant-fixture.sql',
            'tests/world-v2-r18-226-postgres/run.sh',
            'docs/testing/world-v2-r18-226-cross-campaign-integrity-2026-11-22.md',
            '.github/workflows/world-v2-r18-226-cross-campaign-integrity.yml',
          }
          assert changed==expected,'R226_UNREVIEWED_RELEASE_SCOPE'
          sql=open('staging/world-v2-b10-r18-226-cross-campaign-integrity/unapplied-composite-campaign-keys.sql').read()
          assert sql.count('FOREIGN KEY (campaign_id,')==2,'R226_COMPOSITE_SCOPE_DRIFT'
          assert sql.count('NOT VALID;')==2,'R226_REQUIRED_HISTORICAL_NOT_VALID_DRIFT'
          assert 'ON DELETE SET NULL (character_id)' in sql
          assert 'VALIDATE CONSTRAINT' not in '\n'.join(
            line.strip() for line in sql.splitlines()
            if not line.strip().startswith('--')),'R226_FORBIDDEN_HISTORICAL_VALIDATION'
          assert 'DROP TABLE' not in sql.upper()
          assert 'DISABLE ROW LEVEL SECURITY' not in sql.upper()
          PY
      - name: Syntax-check fictional runner and prevent production connection
        run: |
          bash -n tests/world-v2-r18-226-postgres/run.sh
          grep -q 'R226_ISOLATED' tests/world-v2-r18-226-postgres/run.sh
          grep -q '127.0.0.1' tests/world-v2-r18-226-postgres/run.sh

  isolated-postgres17-campaign-binding:
    needs: source-only-tenant-relation-scope
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: r226_disposable_only
          POSTGRES_DB: world_v2_r18_226
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_v2_r18_226"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      R226_ISOLATED: 'yes'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: world_v2_r18_226
      PGUSER: postgres
      PGPASSWORD: r226_disposable_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: PG17 role-gated fictional cross-campaign counterexample and composite FK verification
        shell: bash
        run: bash tests/world-v2-r18-226-postgres/run.sh
